name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  admin-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app_admin/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
