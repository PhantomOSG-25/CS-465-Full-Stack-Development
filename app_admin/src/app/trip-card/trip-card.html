<div class="card h-100" *ngIf="trip as t">
  <div class="card-header">{{ t.name }}</div>

  <img
    class="card-img-top"
    [src]="'assets/images/' + (t.image || 'reef1.jpg')"
    [alt]="t.name"
    (error)="onImageError($event)"
  />

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">{{ t.resort }}</h6>

    <h6 class="card-subtitle mt-3 mb-3 text-muted">
      {{ t.length }} only
      {{ t.perPerson | currency:'USD':'symbol' }}
      per person
    </h6>

    <div class="card-text" [innerHTML]="t.description"></div>

    <button type="button" class="btn btn-primary btn-sm mt-2" (click)="editTrip()">
      Edit
    </button>
  </div>
</div>
