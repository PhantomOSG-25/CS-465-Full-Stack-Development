<div class="card h-100">
  <div class="card-header">{{ trip.name }}</div>

  <img
    class="card-img-top"
    [src]="'assets/images/' + trip.image"
    [alt]="trip.name"
  />

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">{{ trip.resort }}</h6>

    <h6 class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only
      {{ trip.perPerson | currency:'USD':'symbol' }}
      per person
    </h6>

    <p class="card-text" [innerHTML]="trip.description"></p>

    <button
      *ngIf="isLoggedIn()"
      class="btn btn-primary btn-sm mt-2"
      (click)="editTrip()">
      Edit
    </button>
  </div>
</div>
