<div class="card h-100">
  <img [src]="'assets/images/' + trip.image"
       class="card-img-top"
       alt="{{ trip.name }}" />

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="card-text">{{ trip.description }}</p>

    <ul class="list-unstyled mb-3">
      <li><strong>Code:</strong> {{ trip.code }}</li>
      <li><strong>Resort:</strong> {{ trip.resort }}</li>
      <li><strong>Start:</strong> {{ trip.start }}</li>
      <li><strong>Price:</strong> {{ trip.perPerson | currency }}</li>
    </ul>

    <div *ngIf="isAdmin" class="d-flex justify-content-end gap-2">
      <button class="btn btn-sm btn-primary" (click)="onEdit()">
        Edit
      </button>

      <button class="btn btn-sm btn-danger" (click)="onDelete()">
        Delete
      </button>
    </div>
  </div>
</div>
