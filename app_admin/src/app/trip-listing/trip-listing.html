<section>
  <div class="listing-header d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
    <div>
      <p class="section-kicker mb-2">Destination management</p>
      <h1 class="display-5 mb-2">Trip collection</h1>
      <p class="text-secondary mb-0">Review public listings and manage the details behind each getaway.</p>
    </div>

    <button *ngIf="isLoggedIn()"
            class="btn btn-primary rounded-pill px-4"
            (click)="addTrip()">
      Add Trip
    </button>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-xl-4" *ngFor="let trip of trips()">
      <app-trip-card
        [trip]="trip"
        [isAdmin]="isLoggedIn()"
        (edit)="editTrip(trip)"
        (delete)="deleteTrip(trip)">
      </app-trip-card>
    </div>
  </div>

  <div *ngIf="!trips().length" class="alert alert-warning mt-4">
    No trips available.
  </div>

</section>
