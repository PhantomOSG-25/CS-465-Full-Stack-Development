<div class="container mt-3">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Trips</h2>

    <button *ngIf="isLoggedIn()"
            class="btn btn-success"
            (click)="addTrip()">
      Add Trip
    </button>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let trip of trips">
      <app-trip-card
        [trip]="trip"
        [isAdmin]="isLoggedIn()"
        (edit)="editTrip(trip)"
        (delete)="deleteTrip(trip)">
      </app-trip-card>
    </div>
  </div>

  <div *ngIf="!trips.length" class="alert alert-warning mt-3">
    No trips available.
  </div>

</div>
