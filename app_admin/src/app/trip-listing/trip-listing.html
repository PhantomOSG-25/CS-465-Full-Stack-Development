<p>Trips length: {{ trips.length }}</p>

<div class="container">
  <div class="mb-2" *ngIf="isLoggedIn()">
    <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
  </div>

  <div class="row">
    <div *ngFor="let trip of trips" class="col-md-4 mt-2">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
